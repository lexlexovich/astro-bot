name: Сборка видео

on:
  push:
    paths:
      - 'content/**/issue.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'Дата ГГГГ-ММ-ДД — пересобрать видео этого дня'
        required: false

concurrency:
  group: video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        timeout-minutes: 10
        run: |
          # apt-зеркала иногда висят по 20+ минут — ставим с таймаутом, иначе берём статическую сборку ffmpeg
          if ! command -v ffmpeg >/dev/null; then
            timeout 150 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg \
              || (timeout 120 sudo apt-get -o Acquire::http::Timeout=20 update -qq && timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg) \
              || (curl -sSL --max-time 180 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp \
                  && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/)
          fi
          ffmpeg -version | head -1
          pip install -r requirements.txt

      - name: Собрать карточки и видео
        env:
          DAY: ${{ inputs.date }}
        run: |
          today=$(TZ=Europe/Moscow date +%F)
          for f in content/*/issue.json; do
            d=$(dirname "$f"); day=$(basename "$d")
            if [ -n "$DAY" ] && [ "$day" != "$DAY" ]; then continue; fi
            if [ -z "$DAY" ] && [[ "$day" < "$today" ]]; then continue; fi
            if [ -n "$DAY" ]; then rm -f "$d/video.mp4" "$d/video2_tt.mp4"; fi
            python -m render.cards "$d"
            if [ ! -f "$d/video.mp4" ]; then python -m render.video "$d"; fi
            if grep -q '"video2"' "$f" && [ ! -f "$d/video2_tt.mp4" ]; then python -m render.video "$d" video2; fi
          done

      - name: Сохранить
        run: |
          git config user.name "vega-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if ! git diff --cached --quiet; then
            git commit -m "video: сборка"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - name: Сообщить об ошибке
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            --data-urlencode text="⚠️ Меркурий виноват: видео не собралось. GitHub → Actions → «Сборка видео» покажет ошибку." > /dev/null
