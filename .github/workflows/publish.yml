name: Публикация

on:
  schedule:
    # Каждые 10 минут с 06:00 до 22:59 по Москве. Скрипт сам решает, чьё время наступило:
    # 07:30 гороскоп, 12:30 Таро, 18:00 видео, 21:00 вечерний пост, 21:40 отчёт.
    # GitHub запускает cron с задержками и иногда пропускает — частый запуск это страхует.
    - cron: '*/10 3-19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning | tarot | video | evening | report | auto'
        required: true
        default: morning
      date:
        description: 'Дата ГГГГ-ММ-ДД (пусто — сегодня)'
        required: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Определить слот
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then s=auto; else s="${{ inputs.slot }}"; fi
          echo "slot=$s" >> "$GITHUB_OUTPUT"

      - name: Опубликовать
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          DAY: ${{ inputs.date }}
        run: |
          if [ -n "$DAY" ]; then
            python -m publish.telegram "${{ steps.slot.outputs.slot }}" --date "$DAY"
          else
            python -m publish.telegram "${{ steps.slot.outputs.slot }}"
          fi

      - name: Сохранить статус
        if: always()
        run: |
          git config user.name "vega-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/*/status.json content/requests.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "status: ${{ steps.slot.outputs.slot }}"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
